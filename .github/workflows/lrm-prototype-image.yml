# LRM prototype image — the CD half of this fork.
#
# Builds Dockerfile (upstream, unmodified) for linux/amd64, pushes it to GHCR,
# and then boots the pushed image to verify the CoForge prototype contract:
# entrypoint `openviking-entrypoint`, `--without-bot`, port 1933, `/health`.
#
# CoForge consumes the immutable digest printed in the job summary and in the
# `prototype-image-digest` artifact:
#   export COFORGE_OPENVIKING_PROTOTYPE_IMAGE=ghcr.io/lrm-teams/openviking@sha256:...
# Never pin a moving tag in CoForge (infra/compose.openviking-prototype.yml
# requires a reviewed tag or immutable digest).
#
# The image is a NON-PRODUCTION artifact: upstream is AGPL-3.0 and CoForge's
# license review is still pending. Do not deploy it to staging or production.
name: LRM Prototype Image

on:
  push:
    branches: [main]
    # Source and build inputs only: a docs-only or CI-only push must not pay for
    # a full Rust + C++ image build. Path filters are not evaluated for the tag
    # push below, which is why the tags filter is unconditional.
    paths:
      - 'crates/**'
      - 'openviking/**'
      - 'openviking_cli/**'
      - 'bot/**'
      - 'src/**'
      - 'third_party/**'
      - 'web-studio/**'
      - 'deploy/docker/**'
      - 'scripts/build_support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'setup.py'
      - 'Dockerfile'
      - '.github/workflows/lrm-prototype-image.yml'
    tags:
      - 'openviking-prototype-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'PEP 440 version for the image. Empty = resolve from git.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: lrm-prototype-image-${{ github.ref }}
  # Queue a second publish instead of killing the one in flight: a cancelled
  # build exports no layer cache, so cancelling costs the next build a cold run.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lrm-teams/openviking

jobs:
  build:
    name: Build and push (linux/amd64)
    runs-on: ubuntu-24.04
    # Cold builds compile the Rust CLI, the C++ extension, and the Studio bundle.
    timeout-minutes: 180
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve image version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha_short="${SHA_SHORT:0:7}"
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#openviking-prototype-}"
          else
            # Upstream's resolver: OPENVIKING_VERSION, then setuptools-scm.
            python -m pip install --quiet "setuptools-scm>=8.0"
            version="$(python -c 'from scripts.build_support.versioning import resolve_openviking_version; print(resolve_openviking_version())' 2>/dev/null || true)"
            if [ -z "${version}" ] || [ "${version}" = "0.0.0" ]; then
              # Tagless or shallow history: keep a PEP 440 version that still
              # names the commit the image was built from.
              version="0.0.0+sha.${sha_short}"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=OpenViking (LRM fork)
            org.opencontainers.image.description=Non-production LRM fork of OpenViking with the causal-memory line. Not a shipping CoForge artifact.
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=sha,format=short
            type=raw,value=fork-main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=match,pattern=openviking-prototype-(.*),group=1,enable=${{ github.ref_type == 'tag' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A plain image-manifest digest: the pin CoForge records must resolve
          # with a bare `docker pull ...@sha256:...`.
          provenance: false
          sbom: false
          build-args: |
            OPENVIKING_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the prototype pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "## CoForge prototype image"
            echo
            echo "- immutable pin: \`${REGISTRY}/${IMAGE_NAME}@${DIGEST}\`"
            echo "- version: \`${{ steps.version.outputs.version }}\`"
            echo "- revision: \`${{ github.sha }}\`"
            echo "- tags:"
            while IFS= read -r tag; do
              [ -n "${tag}" ] && echo "  - \`${tag}\`"
            done <<< "${TAGS}"
            echo
            echo "CoForge:"
            echo
            echo "\`\`\`bash"
            echo "export COFORGE_OPENVIKING_PROTOTYPE_IMAGE=${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" > prototype-image-digest.txt

      - name: Upload the digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: prototype-image-digest
          path: prototype-image-digest.txt
          retention-days: 90
          if-no-files-found: error

  smoke:
    name: Boot the pushed digest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Log in to the container registry
        # GHCR packages default to private, so the smoke pull needs the same
        # token the build pushed with.
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the pushed digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        run: docker pull "${IMAGE}"

      - name: Verify the image contract
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          entrypoint="$(docker inspect --format '{{json .Config.Entrypoint}}' "${IMAGE}")"
          exposed="$(docker inspect --format '{{json .Config.ExposedPorts}}' "${IMAGE}")"
          echo "entrypoint=${entrypoint}"
          echo "exposed=${exposed}"
          [ "${entrypoint}" = '["openviking-entrypoint"]' ]
          echo "${exposed}" | grep -q '1933/tcp'

      - name: Boot with a synthetic config and wait for /health
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Same shape as upstream's tests/api_test/ov.conf.template (the config
          # upstream's own CI boots a server with): local storage backends and
          # placeholder provider credentials that are never called at startup.
          # No secret, no network.
          conf='{"server":{"host":"0.0.0.0","port":1933,"root_api_key":"ci-smoke-not-a-secret","cors_origins":["*"]},"log":{"level":"INFO"},"storage":{"workspace":"./data","agfs":{"backend":"local"},"vectordb":{"backend":"local"}},"embedding":{"dense":{"provider":"volcengine","api_key":"ci-smoke-not-a-secret","model":"doubao-embedding-vision-251215","api_base":"https://ark.cn-beijing.volces.com/api/v3","dimension":1024,"input":"multimodal"}},"vlm":{"provider":"volcengine","api_key":"ci-smoke-not-a-secret","model":"doubao-seed-2-0-mini-260215","api_base":"https://ark.cn-beijing.volces.com/api/v3","temperature":0.1,"max_retries":3}}'
          docker run --detach --name ov-smoke \
            --publish 1933:1933 \
            --env OPENVIKING_CONF_CONTENT="${conf}" \
            --env OPENVIKING_WITH_BOT=0 \
            "${IMAGE}" --without-bot

          healthy=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:1933/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' ov-smoke)" != "true" ]; then
              echo "::error::container exited before becoming healthy"
              break
            fi
            sleep 5
          done

          if [ "${healthy}" != "1" ]; then
            echo "::error::image did not answer /health within 5 minutes"
            docker logs ov-smoke || true
            docker rm --force ov-smoke || true
            exit 1
          fi

          echo "GET /health:"
          curl -fsS http://127.0.0.1:1933/health
          echo
          echo "container healthcheck command:"
          docker exec ov-smoke openviking-entrypoint --healthcheck
          docker rm --force ov-smoke
